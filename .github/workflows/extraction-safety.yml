name: Extraction safety
on:
  pull_request:
  push:
    branches: [main]
jobs:
  extraction-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/ledger.py data/funds/*.json
      - run: python tools/acfr_funds.py annual-comprehensive-financial-report-fy2025.pdf data/funds
      - run: git diff --exit-code -- data/funds docs
